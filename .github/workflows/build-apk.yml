name: Build MK Importador APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # The experimental runtime is the default artifact for device tests.
    # Publish the separate importer-only variant only when explicitly enabled.
    if: vars.MK_PUBLISH_IMPORTER_ONLY == 'true'
    name: Compile and test Android importer
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      MK_ANDROID_TOOLS: /tmp/mk-android
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install verified JDK and Android build tools
        run: python3 tools/bootstrap_android.py

      - name: Test ZIP extraction and recovery
        run: bash tools/test_importer.sh

      - name: Test XEX metadata inspection
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Compile and verify APK
        run: bash tools/build_apk.sh

      - name: Upload APK and checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: MK-Importador-0.1.0
          path: |
            out/apk/MK-Importador-0.1.0.apk
            out/apk/MK-Importador-0.1.0.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Record build scope
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          APK: **MK Importador 0.1.0** (Android 8.0+).

          The artifact imports ZIP files and checks the XEX2 header. It does **not** execute Mortal Kombat and contains no native game runtime or title-specific recompiled code.

          Importer tests and APK signature verification completed before upload. A fresh runner generates a new local development signing key; its APK may not update an existing installation with a different signer. Uninstalling removes imported files.
          SUMMARY
